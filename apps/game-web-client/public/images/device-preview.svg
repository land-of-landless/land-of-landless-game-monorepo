  <circle cx="150" cy="90" r="10" fill="#2A5A9C"/>
  
  <rect x="140" cy="140" width="20" height="20" rx="3" fill="#E94F64" transform="rotate(45 140 140)"/>
  
  <!-- Warning Icon -->
  <path d="M150 50C152.21 50 154 51.79 154 54V70C154 72.21 152.21 74 150 74C147.79 74 146 72.21 146 70V54C146 51.79 147.79 50 150 50Z" fill="#FFC107"/>
  <circle cx="150" cy="78" r="2" fill="#FFC107"/>
  
