<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone -->
  <rect x="90" y="20" width="120" height="200" rx="10" fill="#1E1E1E" stroke="#4A4A4A" stroke-width="2"/>
  <rect x="100" y="30" width="100" height="180" rx="5" fill="#2A2A2A"/>
  
  <!-- Screen Content -->
  <rect x="110" y="40" width="80" height="140" rx="3" fill="#1A1A1A"/>
  
  <!-- Game Controller -->
  <rect x="50" y="80" width="30" height="60" rx="4" fill="#2A2A2A" stroke="#4A4A4A" stroke-width="1"/>
  <rect x="60" y="90" width="10" height="10" rx="2" fill="#4A4A4A"/>
  <rect x="60" y="120" width="10" height="10" rx="2" fill="#4A4A4A"/>
  
  <rect x="220" y="80" width="30" height="60" rx="4" fill="#2A2A2A" stroke="#4A4A4A" stroke-width="1"/>
